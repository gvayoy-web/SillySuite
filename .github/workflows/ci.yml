name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-python:
    name: Python Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check interno/ tests/
      - run: ruff format --check interno/ tests/

  lint-js:
    name: JavaScript Lint (node --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check interno/frontend/js/scratch-blocks.js
      - run: node --check interno/frontend/js/scratch-runtime.js
      - run: node --check interno/frontend/js/scratch-ui.js
      - run: node --check interno/frontend/js/sillycontrol-api.js

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r interno/requirements.txt
          pip install pytest
      - name: Run tests
        env:
          SILLYQUIZ_HEADLESS: "1"
          CSRF_SECRET: "ci-test-secret"
        run: python -m pytest tests/ -v

  sync-opcodes:
    name: Opcode Sync Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Regenerate opcodes and check for drift
        run: |
          cp scripts/opcodes_gen.py scripts/opcodes_gen.py.bak
          node scripts/sync_opcodes.js
          diff scripts/opcodes_gen.py scripts/opcodes_gen.py.bak || (echo "ERROR: opcodes_gen.py is out of sync. Run: node scripts/sync_opcodes.js" && exit 1)
          rm scripts/opcodes_gen.py.bak
