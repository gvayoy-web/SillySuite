<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SillyQuiz · BuildSilly v6.0 — SILLY PACK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="../css/scratch-blocks.css">
  <link rel="stylesheet" href="../css/scratch-palette.css">
  <link rel="stylesheet" href="../css/scratch-canvas.css">
  <link rel="stylesheet" href="../css/scratch-inspector.css">
  <link rel="stylesheet" href="../css/ndi-panel.css">
  <style>
    html, body {
      margin: 0; height: 100%;
      background:
        radial-gradient(1200px 600px at 12% -10%, #2a2540 0%, transparent 55%),
        radial-gradient(1000px 500px at 110% 120%, #10303a 0%, transparent 55%),
        #ECEAE3;
      font-family: 'Bangers', 'Segoe UI', system-ui, sans-serif;
    }
    #scratchBuilder { height: 100vh; }
    .constructor-welcome {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; color: #0a0a0a; text-align: center; padding: 40px; gap: 14px;
      animation: fadeIn .5s ease;
    }
    .constructor-welcome h3 { font-size: 2.1em; margin: 0; letter-spacing: .01em; }
    .constructor-welcome p { font-size: 1.15em; max-width: 620px; opacity: .8; margin: 0; }
    .constructor-welcome .spinner {
      width: 46px; height: 46px; border-radius: 50%;
      border: 5px solid #0a0a0a; border-top-color: transparent;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .constructor-welcome .badge {
      display: inline-block; padding: 4px 12px; font-weight: 900; font-size: .8rem;
      border: 2px solid #0a0a0a; background: #FFB000; box-shadow: 3px 3px 0 #0a0a0a;
    }
  </style>
</head>
<body>
  <div id="scratchBuilder">
    <div class="constructor-welcome">
      <span class="badge">⚡ SILLY PACK</span>
      <h3>BuildSilly</h3>
      <p>Cargando el editor de bloques…</p>
      <div class="spinner" aria-label="Cargando"></div>
    </div>
  </div>

  <!-- Núcleo -->
  <script src="../js/scratch-blocks.js"></script>
  <script src="../js/scratch-runtime.js"></script>
  <!-- Managers (Fase 3) -->
  <script src="../js/display-manager.js"></script>
  <script src="../js/ndi-manager.js"></script>
  <!-- Proveedores por categoría -->
  <script src="../js/ndi-blocks.js"></script>
  <script src="../js/display-blocks.js"></script>
  <script src="../js/quiz-blocks.js"></script>
  <!-- Editor + orquestador -->
  <script src="../js/scratch-ui.js"></script>
  <script src="../js/scratch-ui-control-definition.js"></script>
  <script src="../js/template-gallery.js"></script>
  <script src="../js/buildsilly-v2.js"></script>
  <script src="../js/buildsilly.js"></script>
</body>
</html>
