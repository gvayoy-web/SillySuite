<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SillyQuiz · BuildSilly v6.0 — SILLY PACK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/scratch-blocks.css">
  <link rel="stylesheet" href="../css/scratch-palette.css">
  <link rel="stylesheet" href="../css/scratch-canvas.css">
  <link rel="stylesheet" href="../css/scratch-inspector.css">
  <link rel="stylesheet" href="../css/ndi-panel.css">
  <script>window.global = window; window.globalThis = window;</script>
  <style>
    :root {
      --bg: #0b0b0b;
      --surface: #161616;
      --border: #3a3a3a;
      --border2: #5a5a5a;
      --text: #f2f2f2;
      --accent: #2b50ff;
      --accent2: #ffd400;
      --font: 'Space Mono', 'Courier New', monospace;
      --font-display: 'Space Grotesk', 'Courier New', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }
    html, body {
      height: 100%;
      background: var(--bg);
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 34px 34px;
      color: var(--text);
      font-family: var(--font);
    }
    #scratchBuilder { height: 100vh; }
    .constructor-welcome {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; text-align: center; padding: 40px; gap: 14px;
    }
    .constructor-welcome h3 {
      font-family: var(--font-display); font-weight: 900; font-size: 2.4rem;
      letter-spacing: 2px; text-transform: uppercase; color: #fff;
      border: 4px solid var(--accent); padding: 6px 18px; box-shadow: 6px 6px 0 var(--accent2);
    }
    .constructor-welcome p { font-size: 1rem; max-width: 620px; opacity: .85; }
    .constructor-welcome .spinner {
      width: 44px; height: 44px; border: 5px solid var(--accent); border-top-color: transparent;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .constructor-welcome .badge {
      display: inline-block; padding: 4px 12px; font-weight: 700; font-size: .8rem;
      border: 2px solid var(--text); background: var(--accent2); color: #000;
      box-shadow: 3px 3px 0 var(--text);
    }
  </style>
</head>
<body>
  <div id="scratchBuilder">
    <div class="constructor-welcome">
      <span class="badge">⚡ SILLY PACK</span>
      <h3>BuildSilly</h3>
      <p>Cargando el editor de bloques…</p>
      <div class="spinner" aria-label="Cargando"></div>
    </div>
  </div>

  <!-- Núcleo -->
  <script src="../js/scratch-blocks.js"></script>
  <script src="../js/scratch-runtime.js"></script>
  <!-- Managers (Fase 3) -->
  <script src="../js/display-manager.js"></script>
  <script src="../js/ndi-manager.js"></script>
  <!-- Proveedores por categoría -->
  <script src="../js/ndi-blocks.js"></script>
  <script src="../js/display-blocks.js"></script>
  <script src="../js/quiz-blocks.js"></script>
  <!-- Editor + orquestador -->
  <script src="../js/scratch-ui.js"></script>
  <script src="../js/scratch-ui-control-definition.js"></script>
  <script src="../js/template-gallery.js"></script>
  <script src="../js/buildsilly-v2.js"></script>
  <script src="../js/buildsilly.js"></script>
</body>
</html>
